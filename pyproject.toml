[project]
name = "aisummit-vla"
version = "0.1.0"
description = "Bimanual VLA manipulation (Intel Online track) with a Speechmatics voice front-end (bonus track), AI Infra Summit 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.13.0",
    "numpy>=2.5.3",
    "openai>=3.13.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "websockets>=17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisummit"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
